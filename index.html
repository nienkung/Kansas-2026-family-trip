  <style>
    :root {
      --bg-color: #E6FFFA;
      --card-bg: #FFFFFF;
      --primary-color: #0F3D3E;
      --tiffany-main: #00A896;
      --tiffany-light: #F0FDF4;
      --tiffany-border: #B2F5EA;
      --sub-color: #4A5568;
      --shadow: 0 4px 16px rgba(0, 168, 150, 0.1);
      --danger: #E53E3E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-color);
      line-height: 1.6;
      padding-bottom: 70px;
    }

    .header {
      position: sticky;
      top: 0;
      background: rgba(230, 255, 250, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--tiffany-border);
    }
    .header h1 { font-size: 20px; font-weight: 800; color: var(--primary-color); letter-spacing: -0.5px; }
    .header p { font-size: 12px; color: var(--sub-color); font-weight: 600; margin-top: 1px; }

    .tab-bar {
      display: flex;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 4px;
      margin-top: 10px;
      border: 1px solid var(--tiffany-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 14px;
      font-weight: 800;
      color: var(--sub-color);
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--tiffany-main);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 168, 150, 0.3);
    }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      margin-bottom: 16px;
      border: 1.5px solid var(--tiffany-border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: #FFFFFF;
    }
    .card-title { font-size: 17px; font-weight: 800; color: var(--primary-color); }
    .card-subtitle { font-size: 13px; color: var(--tiffany-main); font-weight: 700; margin-top: 2px; }
    .chevron {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
      stroke: var(--tiffany-main);
      flex-shrink: 0;
      margin-left: 8px;
    }
    .card.open .chevron { transform: rotate(180deg); }
    .card-content {
      display: none;
      padding: 16px;
      border-top: 1px solid var(--tiffany-border);
      background: #FAFDFC;
    }
    .card.open .card-content { display: block; }

    .spot-card {
      background: #FFFFFF;
      border: 1px solid var(--tiffany-border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      position: relative;
    }
    .spot-time {
      display: inline-block;
      background: #E6FFFA;
      color: var(--tiffany-main);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid var(--tiffany-border);
    }
    .spot-title { font-size: 16px; font-weight: 800; color: var(--primary-color); }
    .spot-desc { font-size: 14px; color: var(--sub-color); font-weight: 600; margin-top: 6px; line-height: 1.5; white-space: pre-line; }
    .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .img-box {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--tiffany-border);
      background: var(--tiffany-light);
      aspect-ratio: 4/3;
    }
    .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .map-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--tiffany-main);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 4px rgba(0, 168, 150, 0.2);
    }

    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 13px; font-weight: 700; color: var(--primary-color); margin-bottom: 4px; display: block; }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--tiffany-border);
      font-size: 15px;
      font-weight: 600;
      outline: none;
      background: #FFF;
    }
    .form-control:focus { border-color: var(--tiffany-main); }
    .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #E6FFFA;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--tiffany-border);
    }
    .btn-submit {
      width: 100%;
      background: var(--tiffany-main);
      color: #FFF;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 168, 150, 0.3);
      margin-top: 6px;
    }
    .expense-item {
      background: #FFF;
      border: 1px solid var(--tiffany-border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .expense-info { flex: 1; }
    .expense-title { font-size: 15px; font-weight: 800; color: var(--primary-color); }
    .expense-meta { font-size: 12px; color: var(--sub-color); margin-top: 2px; font-weight: 600; }
    .expense-amount { font-size: 16px; font-weight: 800; color: var(--tiffany-main); text-align: right; }
    .btn-delete {
      background: #FFF5F5;
      color: var(--danger);
      border: 1px solid #FEB2B2;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .settle-summary {
      background: #FFF;
      border: 2px solid var(--tiffany-main);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .settle-summary-title { font-size: 14px; color: var(--sub-color); font-weight: 700; }
    .settle-summary-val { font-size: 24px; font-weight: 900; color: var(--primary-color); margin: 4px 0; }
    .member-settle-card {
      background: #FFF;
      border: 1.5px solid var(--tiffany-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .member-name { font-size: 16px; font-weight: 800; color: var(--primary-color); }
    .member-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-top: 4px; color: var(--sub-color); }
    .member-status {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--tiffany-border);
      font-size: 15px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }
    .text-plus { color: #2B6CB0; }
    .text-minus { color: var(--danger); }
    .transfer-guide {
      background: var(--tiffany-light);
      border: 1.5px dashed var(--tiffany-main);
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
    }
    .transfer-title { font-size: 15px; font-weight: 800; color: var(--primary-color); margin-bottom: 8px; }
    .transfer-item { font-size: 14px; font-weight: 700; color: var(--tiffany-main); margin-top: 4px; }
    .sync-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #48BB78; margin-right: 4px; }
  </style>
</head>
<body>

  <!-- 頂部頁首 -->
  <div class="header">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1 id="projectTitle">2026 關西家族之旅</h1>
      <span style="font-size: 11px; font-weight: 700; color: #48BB78; display: flex; align-items: center;"><span class="sync-status"></span>雲端即時同步</span>

      <button class="tab-btn" onclick="switchTab('settlement')">⚖️結算拆帳</button>

            </div>
            <div class="form-group">
              <label class="form-label">消費品名</label>
              <input type="text" id="expItem" class="form-control" placeholder="例如：伊根舟屋咖啡" required>
            </div>
            <div class="form-group">
              <label class="form-label">金額</label>
              <input type="number" id="expAmount" class="form-control" placeholder="例如：3500" required>
            </div>
            <div class="form-group">
              <label class="form-label">選擇幣別</label>
              <select id="expCurrency" class="form-control">

                <option value="TWD">NT$ TWD - 新台幣</option>
                <option value="USD">💵 USD - 美元</option>
                <option value="EUR">💶 EUR - 歐元</option>

            </div>
            <div class="form-group">
              <label class="form-label">付款方式</label>
              <select id="expPayment" class="form-control">
                <option value="信用卡" selected>💳 信用卡</option>
                <option value="現金">💴 現金</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">付款人 (誰先付的)</label>
              <select id="expPayer" class="form-control">

                <option value="蝦">蝦</option>
                <option value="爸">爸</option>

            </div>
            <div class="form-group">
              <label class="form-label">分攤對象 (可複選)</label>
              <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" name="splitMember" value="錢粘" checked> 錢粘</label>
                <label class="checkbox-label"><input type="checkbox" name="splitMember" value="蝦" checked> 蝦</label>
                <label class="checkbox-label"><input type="checkbox" name="splitMember" value="爸" checked> 爸</label>

            <button type="submit" class="btn-submit">新增記帳 (同步至全員手機)</button>
          </form>
        </div>
      </div>

      <div id="expenseDayList"></div>

        <div id="transferInstructions">計算中...</div>
      </div>
    </div>

  </div>

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.getAttribute('onclick').includes(tabId));
      if (activeBtn) activeBtn.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    function toggleCard(header) {
      header.parentElement.classList.toggle('open');

    function toggleAllCards(open) {
      document.querySelectorAll('#tab-itinerary .card').forEach(card => {

        const day = data[dayKey];
        const isOpen = idx === 0 ? 'open' : '';

        html += `
          <div class="card ${isOpen}">
            <div class="card-header" onclick="toggleCard(this)">
              <div>
                <div class="card-title">${day.title}</div>
                <div class="card-subtitle">${day.subtitle}</div>
              </div>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M19 9l-7 7-7-7"/></svg>
            </div>
            <div class="card-content">
              ${day.notice ? `<div class="highlight-box">${day.notice}</div>` : ''}
              ${day.spots.map(spot => `
                <div class="spot-card">
                  ${spot.time ? `<span class="spot-time">⏰ ${spot.time}</span>` : ''}
                  <div class="spot-title">${spot.title}</div>
                  <div class="spot-desc">${spot.desc}</div>
                  ${spot.images && spot.images.length > 0 ? `
                    <div class="img-grid">
                      ${spot.images.map(imgUrl => `<div class="img-box"><img src="${imgUrl}" alt="景點照片"></div>`).join('')}
                    </div>
                  ` : ''}
                  ${spot.maps && spot.maps.length > 0 ? `
                    <div class="btn-group">
                      ${spot.maps.map(map => `<a href="${map.url}" class="map-btn" target="_blank">${map.label}</a>`).join('')}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function initFirebaseSync() {
      const expensesRef = window.dbRef(window.db, 'expenses');
      window.dbOnValue(expensesRef, (snapshot) => {
        rawExpenses = snapshot.val() || {};
        renderExpenses();
        renderSettlement();
      });
    }

    function saveExpense(e) {
      e.preventDefault();
      const day = document.getElementById('expDay').value;
      const item = document.getElementById('expItem').value.trim();
      const amount = parseFloat(document.getElementById('expAmount').value);
      const currency = document.getElementById('expCurrency').value;
      const payment = document.getElementById('expPayment').value;
      const payer = document.getElementById('expPayer').value;
      
      const splitCheckboxes = document.querySelectorAll('input[name="splitMember"]:checked');
      const splitMembers = Array.from(splitCheckboxes).map(cb => cb.value);

      if (!item || isNaN(amount) || amount <= 0 || splitMembers.length === 0) {
        alert('請填寫完整的品名、金額與至少一位分攤成員！');
        return;
      }

      const newExpense = {
        day, item, amount, currency, payment, payer, splitMembers, timestamp: Date.now()
      };

      const expensesRef = window.dbRef(window.db, 'expenses');
      window.dbPush(expensesRef, newExpense);

      document.getElementById('expItem').value = '';
      document.getElementById('expAmount').value = '';
    }

    function deleteExpense(id) {
      if (confirm('確定要刪除這筆記帳紀錄嗎？')) {
        const itemRef = window.dbRef(window.db, 'expenses/' + id);
        window.dbRemove(itemRef);
      }
    }

    function openEditModal(id) {
      const data = rawExpenses[id];
      if (!data) return;

      document.getElementById('editExpId').value = id;
      document.getElementById('editExpDay').value = data.day || 'D1';
      document.getElementById('editExpItem').value = data.item || '';
      document.getElementById('editExpAmount').value = data.amount || 0;
      document.getElementById('editExpCurrency').value = data.currency || (data.amountJPY ? 'JPY' : 'TWD');
      document.getElementById('editExpPayment').value = data.payment || '信用卡';
      document.getElementById('editExpPayer').value = data.payer || '錢粘';

      const splitMembers = data.splitMembers || [];
      document.querySelectorAll('input[name="editSplitMember"]').forEach(cb => {
        cb.checked = splitMembers.includes(cb.value);
      });

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function updateExpense(e) {
      e.preventDefault();
      const id = document.getElementById('editExpId').value;
      const day = document.getElementById('editExpDay').value;
      const item = document.getElementById('editExpItem').value.trim();
      const amount = parseFloat(document.getElementById('editExpAmount').value);
      const currency = document.getElementById('editExpCurrency').value;
      const payment = document.getElementById('editExpPayment').value;
      const payer = document.getElementById('editExpPayer').value;

      const splitCheckboxes = document.querySelectorAll('input[name="editSplitMember"]:checked');
      const splitMembers = Array.from(splitCheckboxes).map(cb => cb.value);

      if (!item || isNaN(amount) || amount <= 0 || splitMembers.length === 0) {
        alert('請填寫完整的品名、金額與至少一位分攤成員！');
        return;
      }

      const updatedData = {
        day, item, amount, currency, payment, payer, splitMembers
      };

      const itemRef = window.dbRef(window.db, 'expenses/' + id);
      window.dbUpdate(itemRef, updatedData).then(() => {
        closeEditModal();
      });
    }

    function renderExpenses() {
      const container = document.getElementById('expenseDayList');
      const days = ['D0', 'D1', 'D2', 'D3', 'D4', 'D5', 'D6'];
      const dayNames = { D0: 'D0 (出發前預付)', D1: 'Day 1', D2: 'Day 2', D3: 'Day 3', D4: 'Day 4', D5: 'Day 5', D6: 'Day 6' };

      let html = '';
      days.forEach(day => {
        const items = Object.entries(rawExpenses).filter(([id, data]) => data.day === day);
        
        let dayTotalTWD = 0;
        items.forEach(([id, data]) => {
          const amt = data.amount || data.amountJPY || 0;
          const curr = data.currency || 'JPY';
          const rate = RATES[curr] || 1;
          dayTotalTWD += amt * rate;
        });

        html += `
          <div class="card ${items.length > 0 ? 'open' : ''}">
            <div class="card-header" onclick="toggleCard(this)">
              <div>
                <div class="card-title">${dayNames[day]} 明細</div>
                <div class="card-subtitle">當日小計：約 TWD $${Math.round(dayTotalTWD).toLocaleString()}</div>
              </div>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M19 9l-7 7-7-7"/></svg>
            </div>
            <div class="card-content">
              ${items.length === 0 ? '<div style="font-size:13px; color:var(--sub-color); font-weight:600;">尚無紀錄</div>' : ''}
              ${items.map(([id, data]) => {
                const amt = data.amount || data.amountJPY || 0;
                const curr = data.currency || 'JPY';
                return `
                  <div class="expense-item">
                    <div class="expense-info">
                      <div class="expense-title">${data.item}</div>
                      <div class="expense-meta">${data.payment} · ${data.payer} 先付 · 分攤: ${data.splitMembers ? data.splitMembers.join(', ') : ''}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                      <div class="expense-amount">${amt.toLocaleString()} ${curr}</div>
                      <button class="btn-delete" style="background:#E6FFFA; color:var(--tiffany-main); border-color:var(--tiffany-border);" onclick="openEditModal('${id}')">修改</button>
                      <button class="btn-delete" onclick="deleteExpense('${id}')">刪除</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function renderSettlement() {
      let paidTWD = { '錢粘': 0, '蝦': 0, '爸': 0, '媽': 0 };
      let owedTWD = { '錢粘': 0, '蝦': 0, '爸': 0, '媽': 0 };
      let totalGroupTWD = 0;

      Object.values(rawExpenses).forEach(item => {
        const amt = item.amount || item.amountJPY || 0;
        const curr = item.currency || 'JPY';
        const rate = RATES[curr] || 1;
        const twd = amt * rate;

        totalGroupTWD += twd;

        if (paidTWD[item.payer] !== undefined) {
          paidTWD[item.payer] += twd;
        }

        if (item.splitMembers && item.splitMembers.length > 0) {
          const shareTWD = twd / item.splitMembers.length;
          item.splitMembers.forEach(m => {
            if (owedTWD[m] !== undefined) {
              owedTWD[m] += shareTWD;
            }
          });
        }
      });

      const perPersonTWD = totalGroupTWD / 4;

      document.getElementById('totalGroupExpense').innerText = `TWD $${Math.round(totalGroupTWD).toLocaleString()}`;
      document.getElementById('perPersonShare').innerText = `全團人均參考：TWD $${Math.round(perPersonTWD).toLocaleString()}`;

      let memberHtml = '';
      let balances = {};

      MEMBERS.forEach(m => {
        const net = paidTWD[m] - owedTWD[m];
        balances[m] = net;

        memberHtml += `
          <div class="member-settle-card">
            <div class="member-name">${m}</div>
            <div class="member-row"><span>實際掏出 (包含代墊):</span><span>TWD $${Math.round(paidTWD[m]).toLocaleString()}</span></div>
            <div class="member-row"><span>應分攤總額:</span><span>TWD $${Math.round(owedTWD[m]).toLocaleString()}</span></div>
            <div class="member-status">
              <span>結算狀態:</span>
              <span class="${net >= 0 ? 'text-plus' : 'text-minus'}">
                ${net >= 0 ? '應收回 TWD $' + Math.round(net).toLocaleString() : '應補繳 TWD $' + Math.round(Math.abs(net)).toLocaleString()}
              </span>
            </div>
          </div>
        `;
      });
      document.getElementById('memberSettleList').innerHTML = memberHtml;

      calculateTransfers(balances);
    }

    function calculateTransfers(balances) {
      let debtors = [];
      let creditors = [];

      Object.entries(balances).forEach(([name, amount]) => {
        const rounded = Math.round(amount);
        if (rounded < -1) debtors.push({ name, amount: Math.abs(rounded) });
        else if (rounded > 1) creditors.push({ name, amount: rounded });
      });

      let instructions = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        let debtor = debtors[i];
        let creditor = creditors[j];
        let amount = Math.min(debtor.amount, creditor.amount);

        instructions.push(`👉 <strong>${debtor.name}</strong> 需支付給 <strong>${creditor.name}</strong>：TWD $${amount.toLocaleString()}`);

        debtor.amount -= amount;
        creditor.amount -= amount;

        if (debtor.amount === 0) i++;
        if (creditor.amount === 0) j++;
      }

      if (instructions.length === 0) {
        document.getElementById('transferInstructions').innerHTML = '<div class="transfer-item">🎉 目前收支完美平衡，無需找補！</div>';
      } else {
        document.getElementById('transferInstructions').innerHTML = instructions.map(inst => `<div class="transfer-item">${inst}</div>`).join('');
      }
    }
  </script>
