<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TripPulse 質感旅畔</title>
  
  <!-- Firebase SDK (v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update, set } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXbvtIH6HsWb0jduDabO9Qz8-UZkY0jOA",
      authDomain: "kansai-family-trip-2026.firebaseapp.com",
      databaseURL: "https://kansai-family-trip-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kansai-family-trip-2026",
      storageBucket: "kansai-family-trip-2026.firebasestorage.app",
      messagingSenderId: "567305731001",
      appId: "1:567305731001:web:6d6f70d3294595a65c1468",
      measurementId: "G-ZKPNN1TE2S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.db = db;
    window.dbRef = ref;
    window.dbPush = push;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
    window.dbUpdate = update;
  </script>

  <style>
    :root {
      --brand-main: #00A896;
      --brand-dark: #0F3D3E;
      --brand-bg: #E6FFFA;
      --brand-light: #F0FDF4;
      --brand-border: #B2F5EA;
      --sub-text: #4A5568;
      --card-bg: #FFFFFF;
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 16px rgba(0, 168, 150, 0.12);
      --shadow-lg: 0 10px 30px rgba(0, 168, 150, 0.18);
      --danger: #E53E3E;
      --radius-card: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--brand-bg);
      color: var(--brand-dark);
      line-height: 1.6;
      min-height: 100vh;
    }

    .page-view { display: none; width: 100%; min-height: 100vh; }
    .page-view.active { display: block; }

    /* VIEW 1: 登入頁樣式 */
    .login-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-logo { font-size: 54px; margin-bottom: 8px; }
    .login-title { font-size: 26px; font-weight: 900; color: var(--brand-dark); letter-spacing: -0.5px; }
    .login-subtitle { font-size: 14px; color: var(--sub-text); font-weight: 600; margin-top: 4px; margin-bottom: 24px; text-align: center; }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--brand-border);
      border-radius: var(--radius-card);
      padding: 24px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .feature-list { margin-bottom: 24px; }
    .feature-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .feature-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
    .feature-text h4 { font-size: 14px; font-weight: 800; color: var(--brand-dark); }
    .feature-text p { font-size: 12px; color: var(--sub-text); font-weight: 600; }

    .btn-google {
      width: 100%;
      background: #FFFFFF;
      color: #333333;
      border: 1.5px solid #CBD5E0;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* VIEW 2: 專案大廳樣式 */
    .navbar {
      position: sticky;
      top: 0;
      background: rgba(230, 255, 250, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      padding: 14px 20px;
      border-bottom: 1px solid var(--brand-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar-brand { font-size: 18px; font-weight: 900; color: var(--brand-dark); display: flex; align-items: center; gap: 6px; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-name { font-size: 13px; font-weight: 700; color: var(--brand-dark); }
    .btn-logout {
      background: var(--brand-light);
      color: var(--sub-text);
      border: 1px solid var(--brand-border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .main-container { max-width: 600px; margin: 0 auto; padding: 20px 16px 80px; }
    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--brand-dark);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-add-project {
      background: var(--brand-main);
      color: #FFF;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 168, 150, 0.3);
    }
    .project-grid { display: flex; flex-direction: column; gap: 14px; }
    .project-card {
      background: #FFFFFF;
      border: 1.5px solid var(--brand-border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .project-card:active { transform: scale(0.99); }
    .project-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .project-name { font-size: 17px; font-weight: 800; color: var(--brand-dark); }
    .project-dates { font-size: 13px; color: var(--brand-main); font-weight: 700; margin-top: 2px; }
    .role-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }
    .role-owner { background: #FEFCBF; color: #744210; border: 1px solid #F6E05E; }
    .role-member { background: #EBF8FF; color: #2B6CB0; border: 1px solid #90CDF4; }
    .project-members { margin-top: 10px; font-size: 12px; color: var(--sub-text); font-weight: 600; }

    /* VIEW 3: 專案內部頁面與卡片樣式 */
    .tab-bar {
      display: flex;
      background: #FFFFFF;
      border-radius: 14px;
      padding: 4px;
      margin-top: 10px;
      border: 1px solid var(--brand-border);
      box-shadow: var(--shadow-sm);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 14px;
      font-weight: 800;
      color: var(--sub-text);
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--brand-main);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 168, 150, 0.3);
    }

    .tab-subcontent { display: none; }
    .tab-subcontent.active { display: block; }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      margin-bottom: 16px;
      border: 1.5px solid var(--brand-border);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .card-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: #FFFFFF;
    }
    .card-title { font-size: 17px; font-weight: 800; color: var(--brand-dark); }
    .card-subtitle { font-size: 13px; color: var(--brand-main); font-weight: 700; margin-top: 2px; }
    .chevron {
      width: 20px; height: 20px; transition: transform 0.3s ease; stroke: var(--brand-main); flex-shrink: 0; margin-left: 8px;
    }
    .card.open .chevron { transform: rotate(180deg); }
    .card-content {
      display: none; padding: 16px; border-top: 1px solid var(--brand-border); background: #FAFDFC;
    }
    .card.open .card-content { display: block; }

    .spot-card {
      background: #FFFFFF;
      border: 1px solid var(--brand-border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .spot-time {
      display: inline-block; background: #E6FFFA; color: var(--brand-main); font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--brand-border);
    }
    .spot-title { font-size: 16px; font-weight: 800; color: var(--brand-dark); }
    .spot-desc { font-size: 14px; color: var(--sub-text); font-weight: 600; margin-top: 6px; line-height: 1.5; white-space: pre-line; }
    .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .img-box { width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--brand-border); background: var(--brand-light); aspect-ratio: 4/3; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .map-btn {
      display: inline-flex; align-items: center; gap: 5px; background: var(--brand-main); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; box-shadow: 0 2px 4px rgba(0, 168, 150, 0.2);
    }

    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 13px; font-weight: 700; color: var(--brand-dark); margin-bottom: 4px; display: block; }
    .form-control {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--brand-border); font-size: 15px; font-weight: 600; outline: none; background: #FFF;
    }
    .form-control:focus { border-color: var(--brand-main); }
    .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .checkbox-label {
      display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; cursor: pointer; background: #E6FFFA; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--brand-border);
    }
    .btn-submit {
      width: 100%; background: var(--brand-main); color: #FFF; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 168, 150, 0.3); margin-top: 6px;
    }
    .expense-item {
      background: #FFF; border: 1px solid var(--brand-border); border-radius: 12px; padding: 12px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .expense-info { flex: 1; }
    .expense-title { font-size: 15px; font-weight: 800; color: var(--brand-dark); }
    .expense-meta { font-size: 12px; color: var(--sub-text); margin-top: 2px; font-weight: 600; }
    .expense-amount { font-size: 16px; font-weight: 800; color: var(--brand-main); text-align: right; }
    .btn-delete {
      background: #FFF5F5; color: var(--danger); border: 1px solid #FEB2B2; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    .settle-summary {
      background: #FFF; border: 2px solid var(--brand-main); border-radius: 16px; padding: 16px; margin-bottom: 16px; text-align: center; box-shadow: var(--shadow-md);
    }
    .settle-summary-title { font-size: 14px; color: var(--sub-text); font-weight: 700; }
    .settle-summary-val { font-size: 24px; font-weight: 900; color: var(--brand-dark); margin: 4px 0; }
    .member-settle-card {
      background: #FFF; border: 1.5px solid var(--brand-border); border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .member-name { font-size: 16px; font-weight: 800; color: var(--brand-dark); }
    .member-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-top: 4px; color: var(--sub-text); }
    .member-status {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--brand-border); font-size: 15px; font-weight: 800; display: flex; justify-content: space-between;
    }
    .text-plus { color: #2B6CB0; }
    .text-minus { color: var(--danger); }
    .transfer-guide {
      background: var(--brand-light); border: 1.5px dashed var(--brand-main); border-radius: 14px; padding: 14px; margin-top: 16px;
    }
    .transfer-title { font-size: 15px; font-weight: 800; color: var(--brand-dark); margin-bottom: 8px; }
    .transfer-item { font-size: 14px; font-weight: 700; color: var(--brand-main); margin-top: 4px; }

    .modal-mask {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-box {
      background: #FFF; width: 100%; max-width: 500px; border-radius: 18px; padding: 20px; border: 2px solid var(--brand-main); max-height: 90vh; overflow-y: auto;
    }
    .currency-item {
      padding: 10px; border-bottom: 1px solid var(--brand-border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700;
    }
    .currency-item:hover { background: var(--brand-light); }
  </style>
</head>
<body>

  <!-- VIEW 1：登入頁 -->
  <div id="view-login" class="page-view active">
    <div class="login-container">
      <div class="login-logo" id="siteLogoIcon">✈️</div>
      <h1 class="login-title" id="siteAppName">TripPulse 質感旅畔</h1>
      <p class="login-subtitle" id="siteAppSubtitle">隨心規劃，智慧拆帳｜專屬於你的質感旅遊管家</p>

      <div class="glass-card">
        <div class="feature-list" id="siteFeaturesList"></div>
        <button class="btn-google" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          以 Google 帳號繼續
        </button>
      </div>
    </div>
  </div>

  <!-- VIEW 2：專案大廳 -->
  <div id="view-dashboard" class="page-view">
    <div class="navbar">
      <div class="navbar-brand">
        <span id="dashLogoIcon">✈️</span>
        <span id="dashAppName">TripPulse</span>
      </div>
      <div class="user-profile">
        <span class="user-name" id="dashUserName">錢粘 (Robert)</span>
        <button class="btn-logout" onclick="handleLogout()">登出</button>
      </div>
    </div>

    <div class="main-container">
      <div class="section-title">
        <span>🗂️ 我的旅遊專案</span>
        <button class="btn-add-project" onclick="openNewProjectModal()">＋ 建立新專案</button>
      </div>

      <div class="project-grid" id="projectGridList"></div>
    </div>
  </div>

  <!-- VIEW 3：專案內部 (3 Tabs) -->
  <div id="view-project" class="page-view">
    <div class="navbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="btn-logout" onclick="navigateToDashboard()">← 大廳</button>
        <h2 style="font-size:16px; font-weight:800;" id="activeProjectTitle">載入中...</h2>
      </div>
      <button id="adminSettingsBtn" class="btn-logout" style="display:none; background:var(--brand-main); color:#FFF; border:none;" onclick="openAdminSettingsModal()">⚙️ 專案設定</button>
    </div>

    <div class="main-container" style="padding-top: 12px;">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchProjectTab('itinerary')">📍行程規劃</button>
        <button class="tab-btn" onclick="switchProjectTab('expense')">📝旅程記帳</button>
        <button class="tab-btn" onclick="switchProjectTab('settlement')">⚖️結算拆帳</button>
      </div>

      <div id="projectTabContent" style="margin-top: 16px;">
        
        <!-- TAB 1: 行程規劃 -->
        <div id="subtab-itinerary" class="tab-subcontent active">
          <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <button class="map-btn" style="flex:1; justify-content:center;" onclick="toggleAllCards(true)">全數展開</button>
            <button class="map-btn" style="flex:1; justify-content:center; background:var(--sub-text);" onclick="toggleAllCards(false)">全數收合</button>
          </div>
          <div id="itineraryContainer"></div>
        </div>

        <!-- TAB 2: 旅程記帳 -->
        <div id="subtab-expense" class="tab-subcontent">
          <div class="card open">
            <div class="card-header">
              <div class="card-title">➕ 新增記帳</div>
            </div>
            <div class="card-content" style="display:block;">
              <form id="expenseForm" onsubmit="saveExpense(event)">
                <div class="form-group">
                  <label class="form-label">選擇天數</label>
                  <select id="expDay" class="form-control">
                    <option value="D0">D0 (出發前預付項目)</option>
                    <option value="D1" selected>Day 1</option>
                    <option value="D2">Day 2</option>
                    <option value="D3">Day 3</option>
                    <option value="D4">Day 4</option>
                    <option value="D5">Day 5</option>
                    <option value="D6">Day 6</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">消費品名</label>
                  <input type="text" id="expItem" class="form-control" placeholder="例如：伊根舟屋咖啡" required>
                </div>
                <div class="form-group">
                  <label class="form-label">金額</label>
                  <input type="number" step="any" id="expAmount" class="form-control" placeholder="例如：3500" required>
                </div>
                <div class="form-group">
                  <label class="form-label">選擇幣別</label>
                  <select id="expCurrency" class="form-control" onchange="handleCurrencySelect(this)">
                    <!-- JS 動態帶入 -->
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">付款方式</label>
                  <select id="expPayment" class="form-control">
                    <option value="信用卡" selected>💳 信用卡</option>
                    <option value="現金">💴 現金</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">付款人 (誰先付的)</label>
                  <select id="expPayer" class="form-control" id="expPayerSelect">
                    <!-- JS 動態帶入成員選項 -->
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">分攤對象 (可複選)</label>
                  <div class="checkbox-group" id="expSplitMembersContainer">
                    <!-- JS 動態帶入成員 Checkbox -->
                  </div>
                </div>
                <button type="submit" class="btn-submit">新增記帳 (同步至專案雲端)</button>
              </form>
            </div>
          </div>

          <div id="expenseDayList"></div>
        </div>

        <!-- TAB 3: 結算拆帳 -->
        <div id="subtab-settlement" class="tab-subcontent">
          <div class="settle-summary">
            <div class="settle-summary-title">專案總支出 (折算台幣)</div>
            <div class="settle-summary-val" id="totalGroupExpense">TWD $0</div>
            <div style="font-size: 13px; color: var(--sub-text); margin-top: 4px; font-weight: 600;" id="perPersonShare">全團人均參考：TWD $0</div>
          </div>

          <div style="font-size: 15px; font-weight: 800; color: var(--brand-dark); margin-bottom: 10px;">👥 成員個人結算</div>
          <div id="memberSettleList"></div>

          <div class="transfer-guide">
            <div class="transfer-title">💡 建議最簡找補方案</div>
            <div id="transferInstructions">計算中...</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal 1: 建立新專案彈窗 -->
  <div id="newProjectModal" class="modal-mask">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="font-size:18px; font-weight:800; color:var(--brand-dark);">➕ 建立新旅遊專案</h3>
        <button onclick="closeNewProjectModal()" style="background:none; border:none; font-size:20px; font-weight:800; cursor:pointer;">✕</button>
      </div>
      <form onsubmit="saveNewProject(event)">
        <div class="form-group">
          <label class="form-label">專案名稱</label>
          <input type="text" id="newProjTitle" class="form-control" placeholder="例如：2027 生日東歐獨旅" required>
        </div>
        <div class="form-group">
          <label class="form-label">旅遊日期區間</label>
          <input type="text" id="newProjDates" class="form-control" placeholder="例如：2027/01/09 – 01/17 (9天)" required>
        </div>

        html += `

    function saveExpense(e) {
      e.preventDefault();
      if (!activeProjectId) return;

      const day = document.getElementById('expDay').value;
      const item = document.getElementById('expItem').value.trim();
      const amount = parseFloat(document.getElementById('expAmount').value);
      const currency = document.getElementById('expCurrency').value;
      const payment = document.getElementById('expPayment').value;
      const payer = document.getElementById('expPayerSelect').value;
      
      const splitCheckboxes = document.querySelectorAll('input[name="splitMember"]:checked');
      const splitMembers = Array.from(splitCheckboxes).map(cb => cb.value);

      if (!item || isNaN(amount) || amount <= 0 || splitMembers.length === 0) {
        alert('請填寫品名、金額與分攤成員！');
        return;
      }

      const rate = rates[currency] || 1;
      const newExpense = {
        day, item, amount, currency, exchangeRate: rate, payment, payer, splitMembers, timestamp: Date.now()

    function renderExpenses() {
      const container = document.getElementById('expenseDayList');
      const expenses = activeProjectData.expenses || {};
      const days = ['D0', 'D1', 'D2', 'D3', 'D4', 'D5', 'D6'];

      let html = '';
      days.forEach(day => {
        const items = Object.entries(expenses).filter(([id, data]) => data.day === day);
        let dayTotalTWD = 0;
        items.forEach(([id, data]) => {
          const amt = data.amount || 0;
          const curr = data.currency || 'JPY';
          const rate = data.exchangeRate || rates[curr] || 1;
          dayTotalTWD += amt * rate;
        });

        html += `
          <div class="card ${items.length > 0 ? 'open' : ''}">
            <div class="card-header" onclick="toggleCard(this)">
              <div>
                <div class="card-title">${day} 明細</div>
                <div class="card-subtitle">小計：約 TWD $${Math.round(dayTotalTWD).toLocaleString()}</div>
              </div>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M19 9l-7 7-7-7"/></svg>
            </div>
            <div class="card-content">
              ${items.length === 0 ? '<div style="font-size:13px; color:var(--sub-text);">尚無紀錄</div>' : ''}
              ${items.map(([id, data]) => `
                <div class="expense-item">
                  <div class="expense-info">
                    <div class="expense-title">${data.item}</div>
                    <div class="expense-meta">${data.payment} · ${data.payer} 先付 · 分攤: ${data.splitMembers ? data.splitMembers.join(', ') : ''}</div>

              `).join('')}
            </div>

      });
      container.innerHTML = html;
    }

    function renderSettlement() {
      const expenses = activeProjectData.expenses || {};
      const members = activeProjectData.members || ['錢粘'];

      let paidTWD = {};
      let owedTWD = {};
      members.forEach(m => { paidTWD[m] = 0; owedTWD[m] = 0; });

      let totalGroupTWD = 0;

      Object.values(expenses).forEach(item => {
        const amt = item.amount || 0;
        const curr = item.currency || 'JPY';
        const rate = item.exchangeRate || rates[curr] || 1;
        const twd = amt * rate;

        totalGroupTWD += twd;

        if (paidTWD[item.payer] !== undefined) paidTWD[item.payer] += twd;

        if (item.splitMembers && item.splitMembers.length > 0) {
          const shareTWD = twd / item.splitMembers.length;
          item.splitMembers.forEach(m => {
            if (owedTWD[m] !== undefined) owedTWD[m] += shareTWD;
          });
        }
      });

      const perPersonTWD = totalGroupTWD / (members.length || 1);

      document.getElementById('totalGroupExpense').innerText = `TWD $${Math.round(totalGroupTWD).toLocaleString()}`;
      document.getElementById('perPersonShare').innerText = `全團人均參考：TWD $${Math.round(perPersonTWD).toLocaleString()}`;

      let memberHtml = '';
      let balances = {};

      members.forEach(m => {
        const net = paidTWD[m] - owedTWD[m];
        balances[m] = net;

        memberHtml += `
          <div class="member-settle-card">
            <div class="member-name">${m}</div>
            <div class="member-row"><span>實際掏出 (包含代墊):</span><span>TWD $${Math.round(paidTWD[m]).toLocaleString()}</span></div>
            <div class="member-row"><span>應分攤總額:</span><span>TWD $${Math.round(owedTWD[m]).toLocaleString()}</span></div>
            <div class="member-status">
              <span>結算狀態:</span>
              <span class="${net >= 0 ? 'text-plus' : 'text-minus'}">
                ${net >= 0 ? '應收回 TWD $' + Math.round(net).toLocaleString() : '應補繳 TWD $' + Math.round(Math.abs(net)).toLocaleString()}
              </span>
            </div>
          </div>
        `;
      });
      document.getElementById('memberSettleList').innerHTML = memberHtml;

      calculateTransfers(balances);
    }

    function calculateTransfers(balances) {
      let debtors = [];
      let creditors = [];

      Object.entries(balances).forEach(([name, amount]) => {
        const rounded = Math.round(amount);
        if (rounded < -1) debtors.push({ name, amount: Math.abs(rounded) });
        else if (rounded > 1) creditors.push({ name, amount: rounded });
      });

      let instructions = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        let debtor = debtors[i];
        let creditor = creditors[j];
        let amount = Math.min(debtor.amount, creditor.amount);

        instructions.push(`👉 <strong>${debtor.name}</strong> 需支付給 <strong>${creditor.name}</strong>：TWD $${amount.toLocaleString()}`);

        debtor.amount -= amount;
        creditor.amount -= amount;

        if (debtor.amount === 0) i++;
        if (creditor.amount === 0) j++;
      }

      if (instructions.length === 0) {
        document.getElementById('transferInstructions').innerHTML = '<div class="transfer-item">🎉 目前收支完美平衡，無需找補！</div>';
      } else {
        document.getElementById('transferInstructions').innerHTML = instructions.map(inst => `<div class="transfer-item">${inst}</div>`).join('');
      }
    }

      const members = membersRaw.split(',').map(m => m.trim()).filter(m => m.length > 0);

      const updateData = { title, members };
      window.dbUpdate(window.dbRef(window.db, 'projects/' + activeProjectId), updateData).then(() => {
        closeAdminSettingsModal();
      });
    }

    function deleteCurrentProject() {
      if (confirm('確定要刪除此專案嗎？此動作無法復原！')) {
        window.dbRemove(window.dbRef(window.db, 'projects/' + activeProjectId)).then(() => {
          closeAdminSettingsModal();
          switchView('dashboard');
        });
      }
    }

    function switchProjectTab(tabName) {
      document.querySelectorAll('#view-project .tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-subcontent').forEach(sub => sub.classList.remove('active'));

      const activeBtn = Array.from(document.querySelectorAll('#view-project .tab-btn')).find(b => b.getAttribute('onclick').includes(tabName));
      if (activeBtn) activeBtn.classList.add('active');

      const targetSub = document.getElementById('subtab-' + tabName);
      if (targetSub) targetSub.classList.add('active');
    }

    function updateCurrencyDropdown() {
      const select = document.getElementById('expCurrency');
      if (!select) return;
      let html = '';
      pinnedCurrencies.forEach(code => {
        const item = GLOBAL_CURRENCIES.find(c => c.code === code) || { code, name: code, symbol: '$' };
        html += `<option value="${code}">${item.symbol} ${code} - ${item.name}</option>`;
      });
      html += `<option value="__SEARCH__">＋ 搜尋/新增其他國家貨幣...</option>`;
      select.innerHTML = html;
    }

    function handleCurrencySelect(selectElem) {
      if (selectElem.value === '__SEARCH__') {
        openCurrencyModal();
        selectElem.value = pinnedCurrencies[0];
      }
    }

    function openCurrencyModal() { document.getElementById('currencySearchModal').style.display = 'flex'; filterCurrencyList(); }
    function closeCurrencyModal() { document.getElementById('currencySearchModal').style.display = 'none'; }

    function filterCurrencyList() {
      const query = document.getElementById('currencySearchInput').value.toLowerCase().trim();
      const container = document.getElementById('currencySearchResults');
      const filtered = GLOBAL_CURRENCIES.filter(c => c.code.toLowerCase().includes(query) || c.name.toLowerCase().includes(query));
      container.innerHTML = filtered.map(c => `
        <div class="currency-item" onclick="selectAndPinCurrency('${c.code}')">
          <span>${c.symbol} ${c.code} (${c.name})</span>
          <span style="color:var(--brand-main); font-size:13px;">＋ 加入清單</span>
        </div>
      `).join('');
    }

    function selectAndPinCurrency(code) {
      if (!pinnedCurrencies.includes(code)) pinnedCurrencies.push(code);
      updateCurrencyDropdown();
      document.getElementById('expCurrency').value = code;
      closeCurrencyModal();
    }
  </script>
</body>
</html>
