<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TripPulse 質感旅畔</title>
  
  <!-- Firebase SDK (v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update, set } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXbvtIH6HsWb0jduDabO9Qz8-UZkY0jOA",
      authDomain: "kansai-family-trip-2026.firebaseapp.com",
      databaseURL: "https://kansai-family-trip-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kansai-family-trip-2026",
      storageBucket: "kansai-family-trip-2026.firebasestorage.app",
      messagingSenderId: "567305731001",
      appId: "1:567305731001:web:6d6f70d3294595a65c1468",
      measurementId: "G-ZKPNN1TE2S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.db = db;
    window.dbRef = ref;
    window.dbPush = push;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
    window.dbUpdate = update;
  </script>

  <style>
    /* =========================================================
       🎨 全站視覺主題設定區 (Theme Tokens) - 修改配色/陰影請改這裡！
       ========================================================= */
    :root {
      --brand-main: #00A896;            /* Tiffany 綠主色 */
      --brand-dark: #0F3D3E;            /* 質感深青文字與標題色 */
      --brand-bg: #E6FFFA;              /* 全站主背景色 */
      --brand-light: #F0FDF4;           /* 區塊淺色背景 */
      --brand-border: #B2F5EA;          /* Tiffany 淺綠邊框 */
      --sub-text: #4A5568;              /* 次要文字色 */
      --card-bg: #FFFFFF;               /* 卡片背景 */
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 16px rgba(0, 168, 150, 0.12);
      --shadow-lg: 0 10px 30px rgba(0, 168, 150, 0.18);
      --danger: #E53E3E;
      --radius-card: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--brand-bg);
      color: var(--brand-dark);
      line-height: 1.6;
      min-height: 100vh;
    }

    .page-view { display: none; width: 100%; min-height: 100vh; }
    .page-view.active { display: block; }

    /* =========================================================
       1. 登入頁面樣式 (Login View)
       ========================================================= */
    .login-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-logo {
      font-size: 54px;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--brand-dark);
      letter-spacing: -0.5px;
    }
    .login-subtitle {
      font-size: 14px;
      color: var(--sub-text);
      font-weight: 600;
      margin-top: 4px;
      margin-bottom: 24px;
      text-align: center;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--brand-border);
      border-radius: var(--radius-card);
      padding: 24px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .feature-list { margin-bottom: 24px; }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .feature-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
    .feature-text h4 { font-size: 14px; font-weight: 800; color: var(--brand-dark); }
    .feature-text p { font-size: 12px; color: var(--sub-text); font-weight: 600; }

    .btn-google {
      width: 100%;
      background: #FFFFFF;
      color: #333333;
      border: 1.5px solid #CBD5E0;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }
    .btn-google:active { scale: 0.98; background: #F7FAFC; }

    /* =========================================================
       2. 專案大廳樣式 (Dashboard View)
       ========================================================= */
    .navbar {
      position: sticky;
      top: 0;
      background: rgba(230, 255, 250, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      padding: 14px 20px;
      border-bottom: 1px solid var(--brand-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar-brand { font-size: 18px; font-weight: 900; color: var(--brand-dark); display: flex; align-items: center; gap: 6px; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-name { font-size: 13px; font-weight: 700; color: var(--brand-dark); }
    .btn-logout {
      background: var(--brand-light);
      color: var(--sub-text);
      border: 1px solid var(--brand-border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .main-container { max-width: 600px; margin: 0 auto; padding: 20px 16px 80px; }
    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--brand-dark);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-add-project {
      background: var(--brand-main);
      color: #FFF;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 168, 150, 0.3);
    }
    .project-grid { display: flex; flex-direction: column; gap: 14px; }
    .project-card {
      background: #FFFFFF;
      border: 1.5px solid var(--brand-border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .project-card:active { transform: scale(0.99); }
    .project-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .project-name { font-size: 17px; font-weight: 800; color: var(--brand-dark); }
    .project-dates { font-size: 13px; color: var(--brand-main); font-weight: 700; margin-top: 2px; }
    .role-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }
    .role-owner { background: #FEFCBF; color: #744210; border: 1px solid #F6E05E; }
    .role-member { background: #EBF8FF; color: #2B6CB0; border: 1px solid #90CDF4; }
    .project-members { margin-top: 10px; font-size: 12px; color: var(--sub-text); font-weight: 600; }

    /* =========================================================
       3. 專案內部頁面樣式 (Project Detail View)
       ========================================================= */
    .tab-bar {
      display: flex;
      background: #FFFFFF;
      border-radius: 14px;
      padding: 4px;
      margin-top: 10px;
      border: 1px solid var(--brand-border);
      box-shadow: var(--shadow-sm);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 14px;
      font-weight: 800;
      color: var(--sub-text);
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--brand-main);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 168, 150, 0.3);
    }

    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 13px; font-weight: 700; color: var(--brand-dark); margin-bottom: 4px; display: block; }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--brand-border);
      font-size: 15px;
      font-weight: 600;
      outline: none;
      background: #FFF;
    }
    .form-control:focus { border-color: var(--brand-main); }
    .btn-submit {
      width: 100%;
      background: var(--brand-main);
      color: #FFF;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 168, 150, 0.3);
      margin-top: 6px;
    }

    /* 通用 Modal 樣式 */
    .modal-mask {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #FFF;
      width: 100%;
      max-width: 500px;
      border-radius: 18px;
      padding: 20px;
      border: 2px solid var(--brand-main);
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- =========================================================
     VIEW 1：獨立登入頁模組 (Login View)
     ========================================================= -->
  <div id="view-login" class="page-view active">
    <div class="login-container">
      <div class="login-logo" id="siteLogoIcon">✈️</div>
      <h1 class="login-title" id="siteAppName">TripPulse 質感旅畔</h1>
      <p class="login-subtitle" id="siteAppSubtitle">隨心規劃，智慧拆帳｜專屬於你的質感旅遊管家</p>

      <div class="glass-card">
        <div class="feature-list" id="siteFeaturesList"></div>
        <button class="btn-google" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          以 Google 帳號繼續
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================
     VIEW 2：獨立專案大廳模組 (Dashboard View)
     ========================================================= -->
  <div id="view-dashboard" class="page-view">
    <div class="navbar">
      <div class="navbar-brand">
        <span id="dashLogoIcon">✈️</span>
        <span id="dashAppName">TripPulse</span>
      </div>
      <div class="user-profile">
        <span class="user-name" id="dashUserName">錢粘 (Robert)</span>
        <button class="btn-logout" onclick="handleLogout()">登出</button>
      </div>
    </div>

    <div class="main-container">
      <div class="section-title">
        <span>🗂️ 我的旅遊專案</span>
        <button class="btn-add-project" onclick="openNewProjectModal()">＋ 建立新專案</button>
      </div>

      <div class="project-grid" id="projectGridList"></div>
    </div>
  </div>

  <!-- =========================================================
     VIEW 3：獨立專案內部模組 (Project Detail View)
     ========================================================= -->
  <div id="view-project" class="page-view">
    <div class="navbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="btn-logout" onclick="navigateToDashboard()">← 返回大廳</button>
        <h2 style="font-size:16px; font-weight:800;" id="activeProjectTitle">載入中...</h2>
      </div>
      <!-- 管理員專屬齒輪 (僅 Owner 可見) -->
      <button id="adminSettingsBtn" class="btn-logout" style="display:none; background:var(--brand-main); color:#FFF; border:none;" onclick="openAdminSettingsModal()">⚙️ 專案設定</button>
    </div>

    <div class="main-container" style="padding-top: 12px;">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchProjectTab('itinerary')">📍行程規劃</button>
        <button class="tab-btn" onclick="switchProjectTab('expense')">📝旅程記帳</button>
        <button class="tab-btn" onclick="switchProjectTab('settlement')">⚖️結算拆帳</button>
      </div>

      <div id="projectTabContent" style="margin-top: 16px;">
        <div style="text-align:center; padding:40px; color:var(--sub-text); font-weight:700;">
          已完成解耦！此區域連動 Firebase 該專案之行程與記帳資料庫。
        </div>
      </div>
    </div>
  </div>

  <!-- Modal 1: 建立新專案彈窗 -->
  <div id="newProjectModal" class="modal-mask">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="font-size:18px; font-weight:800; color:var(--brand-dark);">➕ 建立新旅遊專案</h3>
        <button onclick="closeNewProjectModal()" style="background:none; border:none; font-size:20px; font-weight:800; cursor:pointer;">✕</button>
      </div>
      <form onsubmit="saveNewProject(event)">
        <div class="form-group">
          <label class="form-label">專案名稱</label>
          <input type="text" id="newProjTitle" class="form-control" placeholder="例如：2027 生日東歐獨旅" required>
        </div>
        <div class="form-group">
          <label class="form-label">旅遊日期區間</label>
          <input type="text" id="newProjDates" class="form-control" placeholder="例如：2027/01/09 – 01/17 (9天)" required>
        </div>
        <div class="form-group">
          <label class="form-label">基準結算幣別</label>
          <select id="newProjBaseCurrency" class="form-control">
            <option value="TWD" selected>NT$ TWD - 新台幣</option>
            <option value="EUR">💶 EUR - 歐元</option>
            <option value="JPY">💴 JPY - 日圓</option>
            <option value="USD">💵 USD - 美元</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">建立專案並進入</button>
      </form>
    </div>
  </div>

  <!-- Modal 2: 管理員專屬「⚙️ 專案設定」彈窗 -->
  <div id="adminSettingsModal" class="modal-mask">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="font-size:18px; font-weight:800; color:var(--brand-dark);">⚙️ 專案權限與資訊管理</h3>
        <button onclick="closeAdminSettingsModal()" style="background:none; border:none; font-size:20px; font-weight:800; cursor:pointer;">✕</button>
      </div>
      <div style="font-size:13px; color:var(--sub-color); margin-bottom:12px; font-weight:700;">
        👑 您是此專案的建立者 (Owner)，具備最高管理權限。
      </div>
      <div class="form-group">
        <label class="form-label">修改專案名稱</label>
        <input type="text" id="adminProjTitle" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">邀請成員 Email (以逗號分隔)</label>
        <input type="text" id="adminProjMembers" class="form-control" placeholder="lisha@example.com, dad@example.com">
      </div>
      <button class="btn-submit" onclick="saveAdminSettings()">儲存設定修改</button>
      <button class="btn-submit" style="background:#FFF5F5; color:var(--danger); border:1px solid #FEB2B2; margin-top:12px;" onclick="deleteCurrentProject()">🗑️ 刪除此專案</button>
    </div>
  </div>

  <script>
    /* =========================================================
       ⚙️ 網站品牌與文案設定檔 (Site Configuration)
       未來想改網站名字、Logo 或特色簡介，改這裡即可！
       ========================================================= */
    const SITE_CONFIG = {
      appName: "TripPulse 質感旅畔",
      appSubtitle: "隨心規劃，智慧拆帳｜專屬於你的質感旅遊管家",
      logoIcon: "✈️",
      features: [
        { icon: "📍", title: "多國行程動態排程", desc: "手動時間排序與美觀景點卡片" },
        { icon: "💱", title: "全球 160+ 幣別即時換算", desc: "支援冷門貨幣與歷史匯率鎖定" },
        { icon: "🤖", title: "AI 隨手記與批次匯入", desc: "語音、記事本或 Markdown 一鍵解析" }
      ]
    };

    // 模擬目前使用者 (未來直接接入 Firebase Auth)
    let currentUser = {
      name: "錢粘 (Robert)",
      email: "robertcl.kung@ogilvy.com"
    };

    // 示範專案數據庫 (預留寫入 Firebase)
    let mockProjects = [
      {
        id: "proj_kansai_2026",
        title: "2026 日本關西家族之旅",
        dates: "2026/11/19 – 11/24 (6天5夜)",
        ownerEmail: "robertcl.kung@ogilvy.com",
        members: ["robertcl.kung@ogilvy.com", "lisha@example.com"],
        baseCurrency: "TWD"
      },
      {
        id: "proj_europe_2027",
        title: "2027 生日東歐獨旅",
        dates: "2027/01/09 – 01/17 (9天)",
        ownerEmail: "robertcl.kung@ogilvy.com",
        members: ["robertcl.kung@ogilvy.com"],
        baseCurrency: "TWD"
      }
    ];

    let activeProjectId = null;

    window.addEventListener('DOMContentLoaded', () => {
      initSiteConfig();
    });

    // 初始化文案與設定檔
    function initSiteConfig() {
      document.getElementById('siteLogoIcon').innerText = SITE_CONFIG.logoIcon;
      document.getElementById('dashLogoIcon').innerText = SITE_CONFIG.logoIcon;
      document.getElementById('siteAppName').innerText = SITE_CONFIG.appName;
      document.getElementById('dashAppName').innerText = SITE_CONFIG.appName;
      document.getElementById('siteAppSubtitle').innerText = SITE_CONFIG.appSubtitle;

      const featContainer = document.getElementById('siteFeaturesList');
      featContainer.innerHTML = SITE_CONFIG.features.map(f => `
        <div class="feature-item">
          <div class="feature-icon">${f.icon}</div>
          <div class="feature-text">
            <h4>${f.title}</h4>
            <p>${f.desc}</p>
          </div>
        </div>
      `).join('');
    }

    // 切換視圖引擎 (View Switcher)
    function switchView(viewId) {
      document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');
    }

    // Google 登入
    function handleGoogleLogin() {
      switchView('dashboard');
      renderDashboardProjects();
    }

    // 登出
    function handleLogout() {
      switchView('login');
    }

    // 渲染專案大廳
    function renderDashboardProjects() {
      const grid = document.getElementById('projectGridList');
      grid.innerHTML = mockProjects.map(p => {
        const isOwner = p.ownerEmail === currentUser.email;
        return `
          <div class="project-card" onclick="enterProject('${p.id}')">
            <div class="project-header">
              <div>
                <div class="project-name">${p.title}</div>
                <div class="project-dates">📅 ${p.dates}</div>
              </div>
              <span class="role-badge ${isOwner ? 'role-owner' : 'role-member'}">
                ${isOwner ? '👑 專案建立者' : '👥 受邀團員'}
              </span>
            </div>
            <div class="project-members">成員: ${p.members.length} 位 · 基準幣別: ${p.baseCurrency}</div>
          </div>
        `;
      }).join('');
    }

    // 進入單一專案
    function enterProject(projectId) {
      activeProjectId = projectId;
      const proj = mockProjects.find(p => p.id === projectId);
      if (!proj) return;

      document.getElementById('activeProjectTitle').innerText = proj.title;

      // 權限檢查：只有 Owner 顯示「⚙️ 專案設定」
      const adminBtn = document.getElementById('adminSettingsBtn');
      if (proj.ownerEmail === currentUser.email) {
        adminBtn.style.display = 'block';
      } else {
        adminBtn.style.display = 'none';
      }

      switchView('project');
    }

    function navigateToDashboard() {
      switchView('dashboard');
    }

    function openNewProjectModal() {
      document.getElementById('newProjectModal').style.display = 'flex';
    }
    function closeNewProjectModal() {
      document.getElementById('newProjectModal').style.display = 'none';
    }

    function saveNewProject(e) {
      e.preventDefault();
      const title = document.getElementById('newProjTitle').value.trim();
      const dates = document.getElementById('newProjDates').value.trim();
      const baseCurrency = document.getElementById('newProjBaseCurrency').value;

      const newProj = {
        id: 'proj_' + Date.now(),
        title, dates, baseCurrency,
        ownerEmail: currentUser.email,
        members: [currentUser.email]
      };

      mockProjects.unshift(newProj);
      closeNewProjectModal();
      renderDashboardProjects();
      enterProject(newProj.id);
    }

    function openAdminSettingsModal() {
      const proj = mockProjects.find(p => p.id === activeProjectId);
      if (!proj) return;

      document.getElementById('adminProjTitle').value = proj.title;
      document.getElementById('adminProjMembers').value = proj.members.join(', ');
      document.getElementById('adminSettingsModal').style.display = 'flex';
    }

    function closeAdminSettingsModal() {
      document.getElementById('adminSettingsModal').style.display = 'none';
    }

    function saveAdminSettings() {
      const proj = mockProjects.find(p => p.id === activeProjectId);
      if (!proj) return;

      proj.title = document.getElementById('adminProjTitle').value.trim();
      document.getElementById('activeProjectTitle').innerText = proj.title;
      closeAdminSettingsModal();
      renderDashboardProjects();
    }

    function deleteCurrentProject() {
      if (confirm('確定要刪除此專案嗎？此動作無法復原！')) {
        mockProjects = mockProjects.filter(p => p.id !== activeProjectId);
        closeAdminSettingsModal();
        switchView('dashboard');
        renderDashboardProjects();
      }
    }

    function switchProjectTab(tabName) {
      document.querySelectorAll('#view-project .tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('#view-project .tab-btn')).find(b => b.getAttribute('onclick').includes(tabName));
      if (activeBtn) activeBtn.classList.add('active');
    }
  </script>
</body>
</html>
